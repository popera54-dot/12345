name: Build TuneVault for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name TuneVault --collect-all imageio_ffmpeg --collect-all PySide6 main.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/TuneVault/* -DestinationPath TuneVault-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TuneVault-Windows
          path: TuneVault-Windows.zip
          if-no-files-found: error
